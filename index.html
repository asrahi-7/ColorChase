<!DOCTYPE html>
<html>
<head>
    <title>Color Chase Game</title>
    <style>
        /* Prevent text selection on tap */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite, pulseBackground 5s ease infinite;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulseBackground {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        canvas {
            background: rgba(255, 255, 255, 0.9);
            display: block;
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            border: 4px solid #fff;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0,0,0,0.3);
            /* --- MODIFIED FOR RESPONSIVENESS --- */
            width: 95vw; /* Use 95% of the viewport width */
            max-width: 800px; /* But don't let it get bigger than the original size */
            aspect-ratio: 2 / 1; /* Always keep the 2:1 width-to-height ratio */
            height: auto; /* Let the height adjust automatically */
        }

        #controls {
            position: fixed;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10vw;
            z-index: 100;
        }

        button {
            font-size: 15vw;
            cursor: pointer;
            border: none;
            width: 30vw;
            height: 30vw;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.9);
            color: #000;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }

        button:active {
            transform: scale(0.85);
            background: rgba(255,255,255,0.7);
        }

        #scoreBoard {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 6vw;
            background: rgba(0,0,0,0.5);
            padding: 2vw 4vw;
            border-radius: 10px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        #gameOverMessage {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 4vw;
            display: none;
            z-index: 200;
        }

        #instructions {
            position: fixed;
            bottom: 40vh;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 3vw;
            color: #333;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            z-index: 100;
        }

        #instructions h2 {
            margin: 0 0 10px;
            font-size: 4vw;
            color: #ff3366;
        }

        #instructions p {
            margin: 5px 0;
        }

        #instructions a {
            color: #23a6d5;
            text-decoration: none;
            font-weight: bold;
        }

        #instructions a:hover {
            text-decoration: underline;
        }

        #gameControls {
            position: fixed;
            bottom: 20vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5vw;
            z-index: 100;
        }

        #gameControls button {
            font-size: 5vw;
            width: 20vw;
            height: 20vw;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #gameControls button span {
            font-size: 3vw;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="scoreBoard">
        <div>⭐ SCORE: <span id="score">0</span></div>
        <div>🏆 HIGH: <span id="highScore">0</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="instructions">
        <h2>How to Play</h2>
        <p>Use the <strong>⬅️</strong> and <strong>➡️</strong> buttons or <strong>Arrow/A/D</strong> keys to move.</p>
        <p>Press the <strong>🦘</strong> button or <strong>Spacebar/Up Arrow/W</strong> to jump.</p>
        <p>Avoid obstacles and collect coins to score points!</p>
        <p>Made with ❤️ by <a href="https://t.me/asrahi_07" target="_blank" onclick="window.open('https://t.me/asrahi_07', '_blank'); return false;">AS Rahi</a></p>
    </div>
    <div id="gameControls">
        <button id="playButton">
            ▶️
            <span>Play</span>
        </button>
        <button id="pauseButton">
            ⏸️
            <span>Pause</span>
        </button>
        <button id="restartButton">
            🔄
            <span>Restart</span>
        </button>
    </div>
    <div id="controls">
        <button id="left">⬅️</button>
        <button id="jump">🦘</button>
        <button id="right">➡️</button>
    </div>

    <div id="gameOverMessage">
        <p id="performanceText"></p>
    </div>

    <script>
        // Game initialization
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // --- REMOVED fixed canvas size. It will now be set dynamically. ---
        // canvas.width = 800;
        // canvas.height = 400;

        let gameState = {
            player: { x: 200, y: 300, dx: 0, dy: 0, jumpCount: 0 },
            obstacles: [],
            coins: [],
            score: 0,
            highScore: localStorage.getItem('highScore') || 0,
            isGameOver: false,
            isPaused: false
        };

        // Update high score display
        document.getElementById('highScore').textContent = gameState.highScore;

        // --- ADDED: Function to handle resizing the game ---
        function resizeGame() {
            // Get the actual size the canvas is being displayed at
            const newWidth = canvas.clientWidth;
            const newHeight = canvas.clientHeight;
            
            // Update the drawing surface to match the new size
            if (canvas.width !== newWidth || canvas.height !== newHeight) {
                canvas.width = newWidth;
                canvas.height = newHeight;
            }
        }
        // --- END of added section ---

        // Touch handling
        let activeTouches = new Set();

        document.addEventListener('touchstart', e => {
            e.preventDefault();
            Array.from(e.touches).forEach(touch => {
                const button = document.elementFromPoint(touch.clientX, touch.clientY);
                if (button) handleButtonPress(button.id);
            });
        });

        document.addEventListener('touchend', e => {
            e.preventDefault();
            activeTouches.clear();
        });

        document.addEventListener('mousedown', e => {
            if (e.target.closest('button')) handleButtonPress(e.target.id);
        });

        // Keyboard handling for PC/Laptop
        document.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowLeft':
                case 'a':
                    activeTouches.add('left');
                    break;
                case 'ArrowRight':
                case 'd':
                    activeTouches.add('right');
                    break;
                case 'ArrowUp':
                case 'w':
                case ' ': // Spacebar for jump
                    e.preventDefault(); // Prevent page scroll on spacebar
                    if (!gameState.isGameOver && !gameState.isPaused && gameState.player.jumpCount < 2) {
                        gameState.player.dy = -12;
                        gameState.player.jumpCount++;
                    }
                    break;
            }
        });

        document.addEventListener('keyup', e => {
            switch(e.key) {
                case 'ArrowLeft':
                case 'a':
                    activeTouches.delete('left');
                    break;
                case 'ArrowRight':
                case 'd':
                    activeTouches.delete('right');
                    break;
            }
        });

        function handleButtonPress(id) {
            activeTouches.add(id);
            if (id === 'jump' && gameState.player.jumpCount < 2) {
                gameState.player.dy = -12;
                gameState.player.jumpCount++;
            } else if (id === 'playButton') {
                gameState.isPaused = false;
            } else if (id === 'pauseButton') {
                gameState.isPaused = true;
            } else if (id === 'restartButton') {
                resetGame();
            }
        }

        // Game loop
        function update() {
            if (gameState.isGameOver || gameState.isPaused) return;

            // Horizontal movement
            gameState.player.dx = 0;
            if (activeTouches.has('left')) gameState.player.dx = -7;
            if (activeTouches.has('right')) gameState.player.dx = 7;

            // Update positions
            gameState.player.x = Math.max(0, Math.min(canvas.width - 50, gameState.player.x + gameState.player.dx));
            gameState.player.y += gameState.player.dy;

            // Gravity
            // --- MODIFIED: Use canvas.height for dynamic ground position ---
            const groundY = canvas.height - 50;
            if (gameState.player.y + 50 < groundY) {
                gameState.player.dy += 0.5;
            } else {
                gameState.player.y = groundY - 50; // Place player on the ground
                gameState.player.dy = 0;
                gameState.player.jumpCount = 0;
            }

            // Update objects
            gameState.obstacles.forEach(o => o.x -= 5);
            gameState.coins.forEach(c => c.x -= 5);

            // Collision detection
            gameState.obstacles.forEach(obstacle => {
                if (checkCollision(gameState.player, obstacle)) {
                    gameOver();
                }
            });

            gameState.coins.forEach((coin, index) => {
                if (checkCollision(gameState.player, coin)) {
                    gameState.score += 3;
                    gameState.coins.splice(index, 1);
                    document.getElementById('score').textContent = gameState.score;
                }
            });
        }

        function draw() {
            // --- ADDED: Check canvas size before every draw call ---
            resizeGame();

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw player
            ctx.font = "60px Arial";
            ctx.fillStyle = "#ff3366";
            ctx.fillText('😎', gameState.player.x, gameState.player.y);

            // Draw objects
            ctx.font = "40px Arial";
            gameState.obstacles.forEach(o => {
                ctx.fillStyle = o.color;
                ctx.fillText(o.emoji, o.x, o.y);
            });

            gameState.coins.forEach(c => {
                ctx.fillStyle = "#ffd700";
                ctx.fillText('💰', c.x, c.y);
            });
        }

        function checkCollision(a, b) {
            return a.x < b.x + b.width &&
                   a.x + 50 > b.x &&
                   a.y < b.y + b.height &&
                   a.y + 50 > b.y;
        }

        function gameOver() {
            gameState.isGameOver = true;

            // Update high score
            if (gameState.score > gameState.highScore) {
                gameState.highScore = gameState.score;
                localStorage.setItem('highScore', gameState.highScore);
                document.getElementById('highScore').textContent = gameState.highScore;
            }

            // Show funny performance message
            const performanceText = document.getElementById('performanceText');
            const difference = gameState.highScore - gameState.score;
            let message;

            if (gameState.score > 0 && gameState.score >= gameState.highScore) {
                message = "🎉 Wow! You're a LEGEND! 🎉<br>You just set a new high score!";
            } else if (difference <= 50) {
                message = "😲 So close! You were just " + difference + " points away from the high score!";
            } else if (difference <= 100) {
                message = "🤔 Not bad! But you're still " + difference + " points behind the high score.";
            } else {
                message = "😅 Oops! You're " + difference + " points away from the high score. Better luck next time!";
            }

            performanceText.innerHTML = `Game Over!<br>Your Score: ${gameState.score}<br>${message}`;
            document.getElementById('gameOverMessage').style.display = 'block';

            // Restart the game after 5 seconds
            setTimeout(() => {
                resetGame();
            }, 5000);
        }

        function resetGame() {
            gameState = {
                player: { x: canvas.width / 4, y: canvas.height - 100, dx: 0, dy: 0, jumpCount: 0 }, // Use dynamic start positions
                obstacles: [],
                coins: [],
                score: 0,
                highScore: localStorage.getItem('highScore') || 0,
                isGameOver: false,
                isPaused: false
            };
            document.getElementById('score').textContent = 0;
            document.getElementById('gameOverMessage').style.display = 'none';
        }

        // Object creation
        setInterval(() => {
            if (!gameState.isGameOver && !gameState.isPaused) {
                gameState.obstacles.push({
                    x: canvas.width,
                    y: canvas.height - 80, // --- MODIFIED: Dynamic Y position
                    width: 50,
                    height: 50,
                    emoji: ["🚧","🚗","👾"][Math.floor(Math.random()*3)],
                    color: ["#ff5555","#55ff55","#8888ff"][Math.floor(Math.random()*3)]
                });
            }
        }, 2000);

        setInterval(() => {
            if (!gameState.isGameOver && !gameState.isPaused) {
                gameState.coins.push({
                    x: canvas.width,
                    y: Math.random() * (canvas.height - 150) + 50,
                    width: 30,
                    height: 30
                });
            }
        }, 1500);

        // Start game
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // --- ADDED: Listen for window resize events to adjust the game ---
        window.addEventListener('resize', resizeGame);

        // --- ADDED: Initialize the game size on first load ---
        resetGame(); 
        
        gameLoop();
    </script>
</body>
</html>
